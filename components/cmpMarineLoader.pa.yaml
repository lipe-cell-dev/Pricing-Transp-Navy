# Marine loading component for Power Apps canvas apps.
# Minimalist single-colour line art: an outlined container ship bobs on
# scrolling wave lines, with smoke rings, a blinking mast light, animated
# "Loading..." dots and an indeterminate progress bar. All motion is driven
# by one Timer, so it runs on every client (no SMIL/CSS animation in the SVG).
ComponentDefinitions:
  cmpMarineLoader:
    DefinitionType: CanvasComponent
    CustomProperties:
      IsLoading:
        PropertyKind: Input
        DisplayName: IsLoading
        Description: Runs the animation while true.
        DataType: Boolean
        Default: =true
      LoadingText:
        PropertyKind: Input
        DisplayName: LoadingText
        Description: Main message, animated dots are appended.
        DataType: Text
        Default: ="Loading"
      SubText:
        PropertyKind: Input
        DisplayName: SubText
        Description: Secondary message under the main text.
        DataType: Text
        Default: ="Charting the best route"
      AccentColor:
        PropertyKind: Input
        DisplayName: AccentColor
        Description: Line color of the drawing, main text and progress bar.
        DataType: Color
        Default: =RGBA(255, 122, 0, 1)
      BackgroundColor:
        PropertyKind: Input
        DisplayName: BackgroundColor
        Description: Fill behind the scene.
        DataType: Color
        Default: =RGBA(255, 255, 255, 1)
    Properties:
      Width: =640
      Height: =420
      Fill: =cmpMarineLoader.BackgroundColor
    Children:
      - tmrMarineLoader:
          Control: Timer@2.1.0
          Properties:
            Duration: =4000
            Repeat: =true
            AutoStart: =true
            AutoPause: =true
            Start: =cmpMarineLoader.IsLoading
            Visible: =false
            X: =0
            Y: =0
            Width: =10
            Height: =10
      - imgMarineScene:
          Control: Image@2.2.3
          Properties:
            X: =(Parent.Width - Self.Width) / 2
            Y: =Max(0, (Parent.Height - Self.Height - 96) / 2)
            Width: =Min(Parent.Width - 32, 480)
            Height: =Self.Width * 0.4
            ImagePosition: =ImagePosition.Fit
            RadiusTopLeft: =16
            RadiusTopRight: =16
            RadiusBottomLeft: =16
            RadiusBottomRight: =16
            AccessibleLabel: ="Ship sailing on waves"
            Image: |-
              =With(
                  {
                      p: tmrMarineLoader.Value / tmrMarineLoader.Duration,
                      fmt: "0.00",
                      c: Mid(JSON(cmpMarineLoader.AccentColor), 2, 7)
                  },
                  With(
                      {
                          bob: Text(3 * Sin(4 * Pi() * p), fmt, "en-US"),
                          rot: Text(2 * Cos(4 * Pi() * p), fmt, "en-US"),
                          wBack: Text(-60 * Mod(2 * p, 1), fmt, "en-US"),
                          wFront: Text(-90 + 90 * p, fmt, "en-US"),
                          wFar: Text(-120 * p, fmt, "en-US"),
                          q1: Mod(2 * p, 1),
                          q2: Mod(2 * p + 1/2, 1),
                          blink: If(Mod(4 * p, 1) < 0.5, "1", "0.2")
                      },
                      "data:image/svg+xml;utf8," & EncodeUrl(
                          "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 36 400 160' fill='none' stroke='" & c & "' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'>" &
                          "<g transform='translate(0," & bob & ") rotate(" & rot & " 205 142)'>" &
                          "<circle cx='" & Text(155 - 12 * q1, fmt, "en-US") & "' cy='" & Text(78 - 30 * q1, fmt, "en-US") & "' r='" & Text(3 + 5 * q1, fmt, "en-US") & "' stroke-width='2' stroke-opacity='" & Text(1 - q1, fmt, "en-US") & "'/>" &
                          "<circle cx='" & Text(155 - 12 * q2, fmt, "en-US") & "' cy='" & Text(78 - 30 * q2, fmt, "en-US") & "' r='" & Text(3 + 5 * q2, fmt, "en-US") & "' stroke-width='2' stroke-opacity='" & Text(1 - q2, fmt, "en-US") & "'/>" &
                          "<path d='M150,100 L150,86 L160,86 L160,100'/>" &
                          "<rect x='142' y='100' width='26' height='32' rx='2'/>" &
                          "<line x1='148' y1='110' x2='162' y2='110'/>" &
                          "<rect x='176' y='118' width='18' height='14' rx='1.5'/><rect x='198' y='118' width='18' height='14' rx='1.5'/><rect x='220' y='118' width='18' height='14' rx='1.5'/><rect x='242' y='118' width='18' height='14' rx='1.5'/>" &
                          "<rect x='187' y='104' width='18' height='14' rx='1.5'/><rect x='209' y='104' width='18' height='14' rx='1.5'/><rect x='231' y='104' width='18' height='14' rx='1.5'/>" &
                          "<line x1='272' y1='132' x2='272' y2='114'/>" &
                          "<circle cx='272' cy='111' r='2' fill='" & c & "' stroke='none' opacity='" & blink & "'/>" &
                          "<path d='M128,132 L284,132 L268,152 L144,152 Z'/>" &
                          "</g>" &
                          "<g transform='translate(" & wBack & ",0)' opacity='0.45'><path d='M0,160 Q15,156 30,160 T60,160 T90,160 T120,160 T150,160 T180,160 T210,160 T240,160 T270,160 T300,160 T330,160 T360,160 T390,160 T420,160 T450,160 T480,160 T510,160 T540,160'/></g>" &
                          "<g transform='translate(" & wFront & ",0)'><path d='M0,170 Q22.5,164 45,170 T90,170 T135,170 T180,170 T225,170 T270,170 T315,170 T360,170 T405,170 T450,170 T495,170 T540,170 T585,170'/></g>" &
                          "<g transform='translate(" & wFar & ",0)' opacity='0.3' stroke-dasharray='18 14'><path d='M0,184 Q30,181 60,184 T120,184 T180,184 T240,184 T300,184 T360,184 T420,184 T480,184 T540,184 T600,184 T660,184'/></g>" &
                          "</svg>"
                      )
                  )
              )
      - lblMarineLoading:
          Control: Label@2.5.1
          Properties:
            X: =16
            Y: =imgMarineScene.Y + imgMarineScene.Height + 16
            Width: =Parent.Width - 32
            Height: =32
            Align: =Align.Center
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Normal
            Size: =16
            Color: =cmpMarineLoader.AccentColor
            Text: |-
              =cmpMarineLoader.LoadingText & Left("...", Mod(RoundDown(tmrMarineLoader.Value / 400, 0), 4)) & Left("   ", 3 - Mod(RoundDown(tmrMarineLoader.Value / 400, 0), 4))
      - lblMarineSubText:
          Control: Label@2.5.1
          Properties:
            X: =16
            Y: =lblMarineLoading.Y + lblMarineLoading.Height
            Width: =Parent.Width - 32
            Height: =24
            Align: =Align.Center
            Font: =Font.'Segoe UI'
            Size: =10
            Color: =RGBA(128, 128, 128, 1)
            Text: =cmpMarineLoader.SubText
      - imgMarineTrack:
          Control: Image@2.2.3
          Properties:
            X: =(Parent.Width - Self.Width) / 2
            Y: =lblMarineSubText.Y + lblMarineSubText.Height + 12
            Width: =Min(Parent.Width - 64, 240)
            Height: =4
            Image: =Blank()
            Fill: =ColorFade(cmpMarineLoader.AccentColor, 0.8)
            RadiusTopLeft: =2
            RadiusTopRight: =2
            RadiusBottomLeft: =2
            RadiusBottomRight: =2
      - imgMarineBar:
          Control: Image@2.2.3
          Properties:
            X: =imgMarineTrack.X + (imgMarineTrack.Width - Self.Width) * (0.5 - 0.5 * Cos(2 * Pi() * tmrMarineLoader.Value / tmrMarineLoader.Duration))
            Y: =imgMarineTrack.Y
            Width: =imgMarineTrack.Width * 0.3
            Height: =imgMarineTrack.Height
            Image: =Blank()
            Fill: =cmpMarineLoader.AccentColor
            RadiusTopLeft: =2
            RadiusTopRight: =2
            RadiusBottomLeft: =2
            RadiusBottomRight: =2
